name: Sentinel merge-readiness review
description: >
  Reviews pull requests written by coding agents (or people) and tells the reviewer whether they can be merged:
  Ready to merge, Merge after checks, or Do not merge, with evidence. Checks acceptance criteria from the linked issue
  against tests, quality on changed lines, test integrity (deleted/skipped/weakened tests), coverage and mutation testing
  of changed lines, and optionally an AI review against the repo's CLAUDE.md / AGENTS.md.
branding:
  icon: shield
  color: blue

inputs:
  fail-on:
    description: "Fail the check when the verdict is at least this bad: block (Do not merge, default), checks (also Merge after checks), never."
    required: false
    default: block
  install-command:
    description: "How to install the repository under review so its tests can run. Default: auto (pip install -e . plus the dev dependency group, or requirements*.txt)."
    required: false
    default: auto
  python-version:
    description: Python version for the repository under review.
    required: false
    default: "3.12"

outputs:
  verdict:
    description: "ready, after_checks or do_not_merge"
    value: ${{ steps.review.outputs.verdict }}
  score:
    description: Overall score (0-100).
    value: ${{ steps.review.outputs.score }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Sentinel
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Install the repository under review
      shell: bash
      run: |
        if [ "${{ inputs.install-command }}" != "auto" ]; then
          ${{ inputs.install-command }}
        elif [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
          python -m pip install --quiet -e . && (python -m pip install --quiet --group dev 2>/dev/null || true)
        fi
        for f in requirements.txt requirements-dev.txt; do
          [ -f "$f" ] && python -m pip install --quiet -r "$f"
        done
        python -m pip install --quiet pytest

    - name: Review the pull request
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: sentinel review --github --fail-on "${{ inputs.fail-on }}" --json sentinel-report.json

    - name: Keep the report for the review console
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-report
        path: sentinel-report.json
        if-no-files-found: ignore
