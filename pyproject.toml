[project]
name = "sentinel-gate"
version = "1.0.0"
description = "A quality gate for AI-generated Python code: lint, types, security, tests, coverage, mutation testing and requirement tracing, with an LLM repair loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "ruff",
    "mypy",
    "bandit",
    "radon",
    "pytest",
    "pytest-timeout",
    "coverage",
]

[project.optional-dependencies]
dev = []

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true
