name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Sentinel holds itself to the bar it enforces.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check sentinel tests
      - name: Types
        run: uv run mypy sentinel
      - name: Tests (rules + the three demo PRs end to end)
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build review console
        run: npm ci && npm run build
